name: Deploy

# Baut die App und deployt sie als Cloudflare Worker (Static Assets)
# auf <repo-name>.lightweightluu.com. DNS und Zertifikat legt Cloudflare
# beim ersten Deploy automatisch an (Custom Domain).
#
# Benötigte Secrets (in der Org lightweightluu-com für alle Repos gesetzt):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - name: Subdomain aus Repo-Namen ableiten
        id: name
        run: |
          NAME=$(echo "${{ github.event.repository.name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//' \
            | cut -c1-63)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploy-Ziel: https://$NAME.lightweightluu.com"

      - name: Wrangler-Config erzeugen (inkl. Datenbank und Dateispeicher)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/wrangler-config.mjs "${{ steps.name.outputs.name }}"

      - name: Deploy zu Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Admin-Passwort setzen
        continue-on-error: true
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::Secret ADMIN_PASSWORD fehlt: Der Admin-Login bleibt deaktiviert."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Zusammenfassung
        run: |
          echo "### Live: https://${{ steps.name.outputs.name }}.lightweightluu.com" >> "$GITHUB_STEP_SUMMARY"
